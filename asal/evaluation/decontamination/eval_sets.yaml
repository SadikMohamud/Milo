# Every evaluation set Asal will report on is registered here, with its source.
# Before any training run, the training corpus is checked for n-gram overlap
# against every set with status "indexed" (docs/EVALUATION.md, "Decontamination").
# Sets that cannot be fetched yet stay registered as "pending" so they are not forgotten.

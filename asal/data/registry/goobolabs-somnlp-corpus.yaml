notes: 'Studied in RESEARCH_LOG.md (2026-10-02). The corpus text is not in Git; it is rebuilt by a Rust pipeline
  from 17 upstream downloads. Aggregates CC100, mC4, MADLAD and HPLT, which overlap heavily: never add its size
  to theirs. Its LID gate is Lingua (min confidence 0.5), which in Asal''s v0.1 comparison labelled 68% of Oromo
  test sentences as Somali, so Oromo contamination is a risk to measure. Sentence-class sources (OPUS, MT560, NLLB,
  Quran) are not LID-gated or near-deduplicated, per the README. No decontamination stage was found in the repository.
  OPUS/NLLB/MT560 parts may be machine-translated; Somali TinyStories and Somali Alpaca may be model-generated (unknown).
  QuranEnc/Tanzil need licence and sensitivity review and are tracked as the religion domain.'
